{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<style>
    /* Force green color for login avatar */
    .login-container .avatar {
        background: linear-gradient(135deg, #10b981, #059669) !important;
    }
    .login-container .avatar i {
        color: white !important;
        font-size: 40px !important;
    }
    
    /* Override any blue from base.css */
    .avatar {
        background: linear-gradient(135deg, #10b981, #059669) !important;
    }
    .avatar i {
        color: white !important;
    }
</style>
{% endblock %}

{% block title %}Gamer Login - Rehabilitation System{% endblock %}

{% block extra_js %}
<script>
    // قتل الدالة القديمة
    window.loginGamer = function() {
        console.log('Old login function blocked');
        return false;
    };
    
    // الدالة الجديدة
    window.newLoginGamer = async function() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        
        if (!email || !password) {
            document.getElementById('errorMessage').textContent = 'Please enter both email and password';
            document.getElementById('errorMessage').style.display = 'block';
            return;
        }

        document.getElementById('loading').style.display = 'block';
        document.getElementById('errorMessage').style.display = 'none';

        try {
            const response = await fetch('/api/login/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (data.success) {
                const user = data.user;
                
                localStorage.clear();
                
                localStorage.setItem('userType', user.role);
                localStorage.setItem('patientId', user.id);
                localStorage.setItem('patientName', user.name);
                localStorage.setItem('patientEmail', user.email);
                
                if (user.role === 'patient') {
                    if (user.email === 'ali@rehab.com') {
                        localStorage.setItem('patientLevel', '4');
                        localStorage.setItem('patientCondition', 'Motor Disability');
                        localStorage.setItem('patientAccuracy', '82');
                        localStorage.setItem('shoulderStrength', '85');
                        localStorage.setItem('externalRotation', '78');
                        localStorage.setItem('totalSessions', '45');
                        localStorage.setItem('hasAssessmentVideo', 'true');
                    } 
                    else if (user.email === 'sara@rehab.com') {
                        localStorage.setItem('patientLevel', '3');
                        localStorage.setItem('patientCondition', 'Arm Weakness');
                        localStorage.setItem('patientAccuracy', '89');
                        localStorage.setItem('shoulderStrength', '92');
                        localStorage.setItem('externalRotation', '86');
                        localStorage.setItem('totalSessions', '12');
                        localStorage.setItem('hasAssessmentVideo', 'false');
                    } 
                    else if (user.email === 'omar@rehab.com') {
                        localStorage.setItem('patientLevel', '5');
                        localStorage.setItem('patientCondition', 'Movement Disorder');
                        localStorage.setItem('patientAccuracy', '94');
                        localStorage.setItem('shoulderStrength', '88');
                        localStorage.setItem('externalRotation', '96');
                        localStorage.setItem('totalSessions', '68');
                        localStorage.setItem('hasAssessmentVideo', 'true');
                    } 
                    else {
                        localStorage.setItem('patientLevel', '1');
                        localStorage.setItem('patientCondition', 'New Patient');
                        localStorage.setItem('patientAccuracy', '0');
                        localStorage.setItem('shoulderStrength', '0');
                        localStorage.setItem('externalRotation', '0');
                        localStorage.setItem('totalSessions', '0');
                        localStorage.setItem('hasAssessmentVideo', 'false');
                    }
                }
                
                console.log('Login successful, redirecting to /patient/');
                window.location.href = '/patient/';
                
            } else {
                document.getElementById('errorMessage').textContent = data.error || 'Invalid email or password';
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
            }
        } catch (error) {
            console.error('Login error:', error);
            document.getElementById('errorMessage').textContent = 'Connection error';
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        }
    };
</script>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="avatar">
        <i class="fas fa-gamepad"></i>
    </div>
    
    <h2>Gamer Login</h2>
    <p>Enter your credentials to start playing</p>
    
    <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email">
    </div>
    
    <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password">
    </div>
    
    <div class="error-message" id="errorMessage"></div>
    <div class="loading" id="loading">Logging in...</div>
    
    <button class="login-btn" onclick="newLoginGamer()">Start Playing</button>
    
    <button class="back-btn" onclick="window.location.href='{% url "index" %}'">
        <span>←</span> Back to Main Menu
    </button>
</div>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
    
    .login-container {
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        width: 400px;
        text-align: center;
        margin: 0 auto;
    }
    
    .avatar {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #10b981, #059669) !important;
        border-radius: 50%;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 40px;
        box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
    }
    
    .login-container h2 {
        color: #1e293b;
        font-size: 28px;
        margin-bottom: 10px;
    }
    
    .login-container p {
        color: #64748b;
        margin-bottom: 30px;
    }
    
    .input-group {
        margin-bottom: 20px;
        text-align: left;
    }
    
    .input-group label {
        display: block;
        color: #1e293b;
        font-weight: 600;
        margin-bottom: 5px;
    }
    
    .input-group input {
        width: 100%;
        padding: 12px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 16px;
        transition: border 0.3s;
    }
    
    .input-group input:focus {
        border-color: #10b981;
        outline: none;
    }
    
    .login-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #10b981, #059669);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.3s, box-shadow 0.3s;
        margin-top: 10px;
    }
    
    .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
    }
    
    .back-btn {
        margin-top: 20px;
        padding: 12px 20px;
        background: #f1f5f9;
        color: #475569;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }
    
    .back-btn:hover {
        background: #e2e8f0;
        transform: translateY(-2px);
    }
    
    .error-message {
        color: #ef4444;
        margin-top: 10px;
        display: none;
    }
    
    .loading {
        color: #10b981;
        margin-top: 10px;
        display: none;
    }
</style>

<script>
    // Enter key support
    document.getElementById('password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            newLoginGamer();
        }
    });
</script>
{% endblock %}
