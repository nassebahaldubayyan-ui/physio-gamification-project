{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Login - Rehabilitation System</title>
    <link rel="stylesheet" href="{% static 'game/styles.css' %}">
</head>
<body>
    <div class="login-container">
        <div class="avatar">
            <i class="fas fa-gamepad"></i>
        </div>
        
        <h2>Gamer Login</h2>
        <p>Enter your credentials to start playing</p>
        
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>
        
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>
        
        <div class="error-message" id="errorMessage">Invalid email or password</div>
        <div class="loading" id="loading">Logging in...</div>
        
        <button class="login-btn" onclick="loginGamer()">Start Playing</button>
        
        <button class="back-btn" onclick="window.location.href='{% url 'home' %}'">
            <span>←</span> Back to Main Menu
        </button>
    </div>

    <script src="{% static 'game/script.js' %}"></script>
</body>
</html>
