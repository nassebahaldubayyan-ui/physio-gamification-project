{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Patient Profile - Rehabilitation System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .edit-container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .edit-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
        }
        
        .back-btn {
            width: 50px;
            height: 50px;
            background: #f1f5f9;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .back-btn:hover {
            background: #e2e8f0;
            transform: translateX(-5px);
        }
        
        .edit-header h2 {
            color: #1e293b;
            font-size: 32px;
            font-weight: 700;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            color: #1e293b;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            background: white;
        }
        
        .form-input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-input:disabled {
            background: #f1f5f9;
            color: #64748b;
        }
        
        .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            background: white;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #f1f5f9;
        }
        
        .btn-save, .btn-cancel {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-save {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        
        .btn-cancel {
            background: #f1f5f9;
            color: #475569;
        }
        
        .btn-save:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }
        
        .btn-cancel:hover {
            background: #e2e8f0;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="edit-container">
        <div class="edit-header">
            <button class="back-btn" onclick="goBack()">←</button>
            <h2>✏️ Edit Patient Profile</h2>
        </div>

        <form id="editForm" method="POST" action="{% url 'save_patient_profile' %}">
            {% csrf_token %}
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-input" id="fullName" name="name" value="{{ patient.name }}">
                </div>
                <div class="form-group">
                    <label class="form-label">Patient ID</label>
                    <input type="text" class="form-input" id="patientId" name="patient_id" value="{{ patient.id }}" disabled>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="email" name="email" value="{{ patient.email }}">
                </div>
                <div class="form-group">
                    <label class="form-label">Phone</label>
                    <input type="tel" class="form-input" id="phone" name="phone" value="{{ patient.phone }}">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" class="form-input" id="dob" name="dob" value="{{ patient.dob }}">
                </div>
                <div class="form-group">
                    <label class="form-label">Gender</label>
                    <select class="form-select" id="gender" name="gender">
                        <option value="male" {% if patient.gender == 'male' %}selected{% endif %}>Male</option>
                        <option value="female" {% if patient.gender == 'female' %}selected{% endif %}>Female</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Age</label>
                    <input type="text" class="form-input" id="age" readonly style="background: #f1f5f9;">
                </div>
                <div class="form-group">
                    <label class="form-label">&nbsp;</label>
                    <div style="color: #64748b; font-size: 13px; margin-top: 8px;">Auto-calculated</div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Medical Condition</label>
                    <input type="text" class="form-input" id="condition" name="condition" value="{{ patient.condition }}">
                </div>
                <div class="form-group">
                    <label class="form-label">Therapy Type</label>
                    <input type="text" class="form-input" id="therapy" name="therapy" value="{{ patient.therapy }}">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Address</label>
                <input type="text" class="form-input" id="address" name="address" value="{{ patient.address }}">
            </div>

            <div class="action-buttons">
                <button type="submit" class="btn-save">💾 Save Changes</button>
                <button type="button" class="btn-cancel" onclick="goBack()">↩️ Cancel</button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadPatientData();
            document.getElementById('dob').addEventListener('change', calculateAge);
        });

        function loadPatientData() {
            // Load the patient's data from the template context
            const patient = {{ patient|json_script:"patient_data" }};
            document.getElementById('fullName').value = patient.name;
            document.getElementById('patientId').value = patient.id;
            document.getElementById('email').value = patient.email;
            document.getElementById('phone').value = patient.phone;
            document.getElementById('dob').value = patient.dob;
            document.getElementById('gender').value = patient.gender;
            document.getElementById('condition').value = patient.condition;
            document.getElementById('therapy').value = patient.therapy;
            document.getElementById('address').value = patient.address;
            calculateAge();
        }

        function calculateAge() {
            const dobInput = document.getElementById('dob').value;
            if (!dobInput) return;
            
            const dob = new Date(dobInput);
            const today = new Date();
            
            let age = today.getFullYear() - dob.getFullYear();
            const monthDiff = today.getMonth() - dob.getMonth();
            
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < dob.getDate())) {
                age--;
            }
            
            document.getElementById('age').value = age + ' years';
        }

        function goBack() {
            window.location.href = '/patients/{{ patient.id }}';
        }
    </script>
</body>
</html>
