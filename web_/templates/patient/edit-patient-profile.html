{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Profile - Rehabilitation System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
        }

        .back-btn {
            width: 50px;
            height: 50px;
            background: #f1f5f9;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn:hover {
            background: #e2e8f0;
            transform: translateX(-5px);
        }

        .profile-header h2 {
            color: #1e293b;
            font-size: 32px;
            font-weight: 700;
        }

        /* Avatar Section */
        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
        }

        .avatar-large {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
            font-weight: bold;
            border: 4px solid white;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
            overflow: hidden;
            margin-bottom: 15px;
        }

        .avatar-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-buttons {
            display: flex;
            gap: 15px;
        }

        .btn-upload, .btn-delete-avatar {
            padding: 8px 20px;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-upload {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-delete-avatar {
            background: #f1f5f9;
            color: #dc2626;
        }

        .btn-delete-avatar:hover {
            background: #fee2e2;
            transform: translateY(-2px);
        }

        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-card {
            background: #f8fafc;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #e2e8f0;
            transition: all 0.3s;
        }

        .info-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .info-card h3 {
            color: #1e293b;
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-card h3 i {
            color: #667eea;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            background: white;
        }

        .form-input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-input:disabled {
            background: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
        }

        select.form-input:disabled {
            background: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f1f5f9;
        }

        .btn-save, .btn-cancel {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-save {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .btn-cancel {
            background: #f1f5f9;
            color: #475569;
        }

        .btn-save:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-cancel:hover {
            background: #e2e8f0;
            transform: translateY(-3px);
        }

        @media (max-width: 768px) {
            .profile-container {
                padding: 25px;
            }
            .info-grid {
                grid-template-columns: 1fr;
            }
            .profile-header {
                flex-direction: column;
                text-align: center;
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(100%);
            }
        }

        .custom-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            z-index: 9999;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: slideIn 0.3s ease;
            max-width: 350px;
            text-align: center;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            cursor: pointer;
        }

        .avatar-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            backdrop-filter: blur(5px);
        }

        .avatar-modal-content {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .avatar-preview {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: white;
            overflow: hidden;
        }

        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <div class="profile-header">
            <button class="back-btn" onclick="goBack()">←</button>
            <h2><i class="fas fa-user-circle"></i> Edit Profile</h2>
        </div>

        <!-- Avatar Section -->
        <div class="avatar-section">
            <div class="avatar-large" id="avatarLarge">
                <span id="avatarText">A</span>
            </div>
            <div class="avatar-buttons">
                <button class="btn-upload" onclick="showAvatarUploadModal()">
                    <i class="fas fa-camera"></i> Upload Avatar
                </button>
                <button class="btn-delete-avatar" onclick="deleteAvatar()">
                    <i class="fas fa-trash-alt"></i> Delete Avatar
                </button>
            </div>
        </div>

        <div class="info-grid">
            <!-- Personal Information Card -->
            <div class="info-card">
                <h3><i class="fas fa-id-card"></i> Personal Information</h3>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-user"></i> Full Name</label>
                    <input type="text" class="form-input" id="fullNameInput" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-id-card"></i> Patient ID</label>
                    <input type="text" class="form-input" id="patientIdInput" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" class="form-input" id="emailInput">
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-phone"></i> Phone</label>
                    <input type="tel" class="form-input" id="phoneInput">
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-calendar-alt"></i> Date of Birth</label>
                    <input type="date" class="form-input" id="dobInput">
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-venus-mars"></i> Gender</label>
                    <select class="form-input" id="genderInput" disabled>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
            </div>

            <!-- Medical Information Card -->
            <div class="info-card">
                <h3><i class="fas fa-hospital"></i> Medical Information</h3>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-stethoscope"></i> Medical Condition</label>
                    <input type="text" class="form-input" id="conditionInput" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-hand-paper"></i> Affected Hand</label>
                    <select class="form-input" id="affectedHandInput" disabled>
                        <option value="right">Right Hand</option>
                        <option value="left">Left Hand</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-chart-line"></i> Current Level</label>
                    <input type="text" class="form-input" id="currentLevelInput" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-map-marker-alt"></i> Address</label>
                    <input type="text" class="form-input" id="addressInput">
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button type="button" class="btn-save" onclick="saveProfile()">
                <i class="fas fa-save"></i> Save Changes
            </button>
            <button type="button" class="btn-cancel" onclick="cancelEdit()">
                <i class="fas fa-times"></i> Cancel
            </button>
        </div>
    </div>

    <script>
        // ============================================
        // GLOBAL VARIABLES
        // ============================================
        let patientData = {};

        // ============================================
        // INITIALIZATION
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            loadPatientData();
            loadAvatar();
        });

        // ============================================
        // LOAD PATIENT DATA
        // ============================================
        async function loadPatientData() {
            try {
                const response = await fetch('/api/my-patient-data/');
                const data = await response.json();
                if (data.success) {
                    const p = data.patient;
                    patientData = p;

                    document.getElementById('fullNameInput').value = p.name || '';
                    document.getElementById('patientIdInput').value = p.patient_id || '';
                    document.getElementById('emailInput').value = p.email || '';
                    document.getElementById('phoneInput').value = p.phone || '';
                    document.getElementById('dobInput').value = p.date_of_birth || '';
                    document.getElementById('genderInput').value = p.gender?.toLowerCase() === 'female' ? 'female' : 'male';
                    document.getElementById('conditionInput').value = p.medical_condition || '';
                    document.getElementById('affectedHandInput').value = p.affected_hand || 'right';
                    document.getElementById('currentLevelInput').value = p.current_level || '1';
                    document.getElementById('addressInput').value = p.address || '';

                    const avatarText = document.getElementById('avatarText');
                    if (avatarText) avatarText.textContent = (p.name || 'A').charAt(0).toUpperCase();
                } else {
                    showNotification('Error loading profile data', 'error');
                }
            } catch (error) {
                showNotification('Connection error loading profile', 'error');
            }
        }

        function updateFormValues() {
            document.getElementById('fullNameInput').value = patientData.fullName;
            document.getElementById('patientIdInput').value = patientData.patientId;
            document.getElementById('emailInput').value = patientData.email;
            document.getElementById('phoneInput').value = patientData.phone;
            document.getElementById('dobInput').value = patientData.dob;
            document.getElementById('genderInput').value = patientData.gender;
            document.getElementById('conditionInput').value = patientData.condition;
            document.getElementById('affectedHandInput').value = patientData.affectedHand;
            document.getElementById('currentLevelInput').value = patientData.currentLevel;
            document.getElementById('addressInput').value = patientData.address;
            
            // Update avatar text
            document.getElementById('avatarText').textContent = patientData.fullName.charAt(0).toUpperCase();
        }

        // ============================================
        // SAVE PROFILE
        // ============================================
        async function saveProfile() {
            const nameParts = document.getElementById('fullNameInput').value.trim().split(' ');
            const firstName = nameParts[0] || '';
            const lastName = nameParts.slice(1).join(' ') || '';

            const updatedData = {
                first_name: firstName,
                last_name: lastName,
                email: document.getElementById('emailInput').value.trim(),
                phone: document.getElementById('phoneInput').value.trim(),
                date_of_birth: document.getElementById('dobInput').value,
                gender: document.getElementById('genderInput').value,
                affected_hand: document.getElementById('affectedHandInput').value,
                address: document.getElementById('addressInput').value.trim(),
            };

            if (!updatedData.email || !updatedData.phone) {
                showNotification('Please fill in email and phone fields', 'error');
                return;
            }

            try {
                const response = await fetch('/api/update-patient-profile/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify(updatedData)
                });

                const data = await response.json();

                if (data.success) {
                    showNotification('Profile updated successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = "{% url 'profile' %}";
                    }, 1500);
                } else {
                    showNotification(data.error || 'Error updating profile', 'error');
                }
            } catch (error) {
                showNotification('Connection error. Please try again.', 'error');
            }
        }

        function cancelEdit() {
            loadPatientData();
            showNotification('Changes cancelled', 'info');
        }

        // ============================================
        // AVATAR FUNCTIONS
        // ============================================
        function loadAvatar() {
            const savedAvatar = localStorage.getItem('userAvatar');
            const avatarLarge = document.getElementById('avatarLarge');
            const avatarText = document.getElementById('avatarText');
            
            if (savedAvatar && savedAvatar !== 'null' && savedAvatar !== '') {
                avatarLarge.innerHTML = `<img src="${savedAvatar}" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">`;
            } else {
                avatarLarge.innerHTML = `<span id="avatarText">${(patientData?.name || patientData?.fullName || 'A').charAt(0).toUpperCase()}</span>`;
            }
        }

        function saveAvatarToLocalStorage(imageData) {
            localStorage.setItem('userAvatar', imageData);
            sessionStorage.setItem('userAvatar', imageData);
        }

        function deleteAvatar() {
            localStorage.removeItem('userAvatar');
            sessionStorage.removeItem('userAvatar');
            
            const avatarLarge = document.getElementById('avatarLarge');
            const firstLetter = (patientData?.name || patientData?.fullName || 'A').charAt(0).toUpperCase();
            avatarLarge.innerHTML = `<span id="avatarText">${firstLetter}</span>`;
            
            showNotification('Avatar deleted successfully!', 'success');
        }

        function showAvatarUploadModal() {
            const modal = document.createElement('div');
            modal.className = 'avatar-modal';
            modal.innerHTML = `
                <div class="avatar-modal-content">
                    <h3 style="color: #1e293b; margin-bottom: 10px;">Upload Avatar</h3>
                    <p style="color: #64748b; margin-bottom: 20px;">Choose a profile picture</p>
                    <div class="avatar-preview" id="avatarPreview">
                        <span id="previewText">${(patientData?.name || patientData?.fullName || 'A').charAt(0).toUpperCase()}</span>
                    </div>
                    <input type="file" id="avatarUpload" accept="image/*" style="margin: 20px 0; width: 100%;">
                    <div style="display: flex; gap: 15px; margin-top: 20px;">
                        <button id="saveAvatarBtn" style="flex:1; padding: 12px; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600;">Save</button>
                        <button id="cancelAvatarBtn" style="flex:1; padding: 12px; background: #f1f5f9; color: #475569; border: none; border-radius: 12px; cursor: pointer; font-weight: 600;">Cancel</button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            const fileInput = modal.querySelector('#avatarUpload');
            const previewDiv = modal.querySelector('#avatarPreview');
            
            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        previewDiv.innerHTML = `<img src="${event.target.result}" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">`;
                    };
                    reader.readAsDataURL(file);
                }
            });
            
            modal.querySelector('#saveAvatarBtn').onclick = function() {
                const file = fileInput.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const imageData = event.target.result;
                        saveAvatarToLocalStorage(imageData);
                        loadAvatar();
                        showNotification('Avatar updated successfully!', 'success');
                    };
                    reader.readAsDataURL(file);
                } else {
                    showNotification('Please select an image first', 'error');
                }
                modal.remove();
            };
            
            modal.querySelector('#cancelAvatarBtn').onclick = function() {
                modal.remove();
            };
            
            modal.onclick = function(e) {
                if (e.target === modal) modal.remove();
            };
        }

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        function goBack() {
            window.location.href = "{% url 'patient_dashboard' %}";
        }

        function showNotification(message, type = 'info') {
            const oldNotification = document.querySelector('.custom-notification');
            if (oldNotification) oldNotification.remove();
            
            const notification = document.createElement('div');
            notification.className = 'custom-notification';
            
            const icon = type === 'success' ? 'fa-check-circle' : 
                        type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            
            notification.innerHTML = `<i class="fas ${icon}"></i> ${message}`;
            
            const colors = {
                info: 'linear-gradient(135deg, #3b82f6, #1d4ed8)',
                success: 'linear-gradient(135deg, #10b981, #059669)',
                error: 'linear-gradient(135deg, #ef4444, #dc2626)'
            };
            
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 25px;
                border-radius: 12px;
                background: ${colors[type] || colors.info};
                color: white;
                font-weight: 500;
                z-index: 9999;
                box-shadow: 0 10px 25px rgba(0,0,0,0.2);
                animation: slideIn 0.3s ease;
                max-width: 350px;
                text-align: center;
                display: flex;
                align-items: center;
                gap: 12px;
                font-size: 15px;
                cursor: pointer;
            `;
            
            notification.onclick = () => {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            };
            
            document.body.appendChild(notification);
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.style.animation = 'slideOut 0.3s ease';
                    setTimeout(() => notification.remove(), 300);
                }
            }, 4000);
        }

        // Listen for storage changes
        window.addEventListener('storage', function(e) {
            if (e.key === 'userAvatar') {
                loadAvatar();
            }
        });
    </script>
</body>
</html>
