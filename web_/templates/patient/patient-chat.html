{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Doctor - Rehabilitation System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .chat-container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 25px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .doctor-avatar-large {
            width: 60px;
            height: 60px;
            background: transparent;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: white;
            border: 2px solid white;
        }
        
        .chat-header-info h2 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .chat-header-info p {
            opacity: 0.9;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .online-dot {
            width: 10px;
            height: 10px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .chat-messages {
            height: 400px;
            overflow-y: auto;
            padding: 30px;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            display: flex;
            margin-bottom: 10px;
        }
        
        .message.doctor {
            justify-content: flex-start;
        }
        
        .message.patient {
            justify-content: flex-end;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            position: relative;
            word-wrap: break-word;
        }
        
        .message.doctor .message-content {
            background: white;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 5px;
        }
        
        .message.patient .message-content {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .message-time {
            font-size: 11px;
            margin-top: 5px;
            opacity: 0.7;
        }
        
        .chat-input {
            padding: 20px 30px;
            background: white;
            border-top: 2px solid #f1f5f9;
            display: flex;
            gap: 15px;
        }
        
        .chat-input input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }
        
        .chat-input input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .chat-input button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .chat-input button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .chat-input button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-back {
            margin: 20px 30px 30px;
            padding: 12px 30px;
            background: #f1f5f9;
            color: #475569;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-back:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
            font-size: 18px;
        }
        
        .message-status {
            font-size: 11px;
            margin-top: 2px;
            text-align: right;
            opacity: 0.7;
        }
        
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 15px 20px;
            background: white;
            border-radius: 18px;
            border-bottom-left-radius: 5px;
            width: fit-content;
            margin-bottom: 10px;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #94a3b8;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out;
        }
        
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <!-- Hidden CSRF Token -->
    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}" id="csrfToken">

    <div class="chat-container">
        <div class="chat-header">
            <div class="doctor-avatar-large">
                <i class="fas fa-user-circle"></i>
            </div>
            <div class="chat-header-info">
                <h2 id="doctorName">Dr. {{ patient.assigned_doctor.get_full_name|default:"Ahmad" }}</h2>
                <p><span class="online-dot"></span> Online</p>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="loading" id="loading">Loading messages...</div>
        </div>

        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()" id="sendBtn">Send</button>
        </div>

        <button class="btn-back" onclick="goBack()">
            <span>←</span> Back to Dashboard
        </button>
    </div>

    <script src="{% static 'js/script.js' %}"></script>
    <script>
        // Check if user is authenticated and is patient
        const isAuthenticated = {{ user.is_authenticated|lower }};
        const userType = "{{ user.user_type }}";
        
        if (!isAuthenticated || userType !== 'patient') {
            window.location.href = "{% url 'gamer_login' %}";
        }

        // Django variables
        const csrfToken = document.getElementById('csrfToken').value;
        const patientId = {{ patient.id }};
        const doctorId = {{ patient.assigned_doctor.id|default:'null' }};
        
        let messages = [];
        let typingTimeout;
        let isTyping = false;
        let lastMessageId = 0;

        document.addEventListener('DOMContentLoaded', function() {
            loadMessages();
            startTypingDetection();
            startMessagePolling();
        });

        async function loadMessages() {
            document.getElementById('loading').style.display = 'block';
            
            try {
                const response = await fetch('/api/get-messages/', {
                    headers: {
                        'X-CSRFToken': csrfToken
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    messages = data.messages;
                    renderMessages(messages);
                    
                    if (messages.length > 0) {
                        lastMessageId = messages[messages.length - 1].id;
                    }
                }
            } catch (error) {
                console.error('Error loading messages:', error);
                // Fallback to mock data
                const mockMessages = [
                    { 
                        id: 1,
                        sender: 'doctor', 
                        text: 'Hello! How are you feeling today?', 
                        time: getTimeString(new Date(Date.now() - 3600000)),
                        read: true
                    },
                    { 
                        id: 2,
                        sender: 'patient', 
                        text: 'I am feeling much better, thank you!', 
                        time: getTimeString(new Date(Date.now() - 1800000)),
                        read: true
                    }
                ];
                messages = mockMessages;
                renderMessages(mockMessages);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function renderMessages(messagesArray) {
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = '';
            
            messagesArray.forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${msg.sender === 'patient' ? 'patient' : 'doctor'}`;
                messageDiv.innerHTML = `
                    <div class="message-content">
                        ${msg.text}
                        <div class="message-time">${msg.time}</div>
                    </div>
                `;
                chatMessages.appendChild(messageDiv);
            });
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Disable input while sending
            input.disabled = true;
            document.getElementById('sendBtn').disabled = true;
            
            const timeString = getTimeString(new Date());
            
            // Add message to UI immediately
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message patient';
            messageDiv.innerHTML = `
                <div class="message-content">
                    ${message}
                    <div class="message-time">${timeString}</div>
                    <div class="message-status">✓ Sending...</div>
                </div>
            `;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            // Send to server
            try {
                const response = await fetch('/api/send-message/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify({
                        receiver_id: doctorId,
                        message: message
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Update message status
                    messageDiv.querySelector('.message-status').textContent = '✓ Sent';
                    
                    // Add to messages array
                    messages.push({
                        id: data.message_id,
                        sender: 'patient',
                        text: message,
                        time: timeString
                    });
                    
                    input.value = '';
                    
                    // Simulate doctor typing after a delay
                    simulateDoctorTyping();
                } else {
                    messageDiv.querySelector('.message-status').textContent = '✗ Failed to send';
                    messageDiv.querySelector('.message-status').style.color = '#ef4444';
                }
            } catch (error) {
                console.error('Error sending message:', error);
                messageDiv.querySelector('.message-status').textContent = '✗ Connection error';
                messageDiv.querySelector('.message-status').style.color = '#ef4444';
            } finally {
                input.disabled = false;
                document.getElementById('sendBtn').disabled = false;
                input.focus();
            }
        }

        function simulateDoctorTyping() {
            // Show typing indicator
            const chatMessages = document.getElementById('chatMessages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message doctor';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            // Simulate reply after 3 seconds
            setTimeout(() => {
                document.getElementById('typingIndicator')?.remove();
                
                const replyDiv = document.createElement('div');
                replyDiv.className = 'message doctor';
                replyDiv.innerHTML = `
                    <div class="message-content">
                        Thank you for your message. I'll get back to you soon.
                        <div class="message-time">${getTimeString(new Date())}</div>
                    </div>
                `;
                chatMessages.appendChild(replyDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 3000);
        }

        function startTypingDetection() {
            const input = document.getElementById('messageInput');
            
            input.addEventListener('input', function() {
                if (!isTyping && this.value.length > 0) {
                    isTyping = true;
                    // Notify server that patient is typing
                    fetch('/api/typing-status/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrfToken
                        },
                        body: JSON.stringify({ typing: true })
                    });
                }
                
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    if (isTyping) {
                        isTyping = false;
                        // Notify server that patient stopped typing
                        fetch('/api/typing-status/', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-CSRFToken': csrfToken
                            },
                            body: JSON.stringify({ typing: false })
                        });
                    }
                }, 1000);
            });
        }

        function startMessagePolling() {
            setInterval(async () => {
                try {
                    const response = await fetch(`/api/get-new-messages/?last_id=${lastMessageId}`, {
                        headers: {
                            'X-CSRFToken': csrfToken
                        }
                    });
                    
                    const data = await response.json();
                    
                    if (data.success && data.messages.length > 0) {
                        data.messages.forEach(msg => {
                            messages.push(msg);
                            lastMessageId = Math.max(lastMessageId, msg.id);
                        });
                        renderMessages(messages);
                    }
                } catch (error) {
                    console.error('Error polling messages:', error);
                }
            }, 5000); // Poll every 5 seconds
        }

        function getTimeString(date) {
            return date.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: true 
            });
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function goBack() {
            window.location.href = "{% url 'patient_dashboard' %}";
        }
    </script>
</body>
</html>
