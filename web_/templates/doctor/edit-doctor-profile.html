{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Doctor Profile - Rehabilitation System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .edit-container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .edit-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
        }
        
        .back-btn {
            width: 50px;
            height: 50px;
            background: #f1f5f9;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .back-btn:hover {
            background: #e2e8f0;
            transform: translateX(-5px);
        }
        
        .edit-header h2 {
            color: #1e293b;
            font-size: 32px;
            font-weight: 700;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            color: #1e293b;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            background: white;
        }
        
        .form-input:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #f1f5f9;
        }
        
        .btn-save, .btn-cancel {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-save {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
        }
        
        .btn-cancel {
            background: #f1f5f9;
            color: #475569;
        }
        
        .btn-save:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }
        
        .btn-cancel:hover {
            background: #e2e8f0;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="edit-container">
        <div class="edit-header">
            <button class="back-btn" onclick="goBack()">←</button>
            <h2>✏️ Edit Doctor Profile</h2>
        </div>

        <form id="editForm" method="POST" action="{% url 'save_doctor_profile' %}">
            {% csrf_token %}
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-input" id="fullName" name="name" value="{{ doctor.name }}">
                </div>
                <div class="form-group">
                    <label class="form-label">Doctor ID</label>
                    <input type="text" class="form-input" id="doctorId" name="doctor_id" value="{{ doctor.id }}" disabled>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="email" name="email" value="{{ doctor.email }}">
                </div>
                <div class="form-group">
                    <label class="form-label">Phone</label>
                    <input type="tel" class="form-input" id="phone" name="phone" value="{{ doctor.phone }}">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Specialty</label>
                    <input type="text" class="form-input" id="specialty" name="specialty" value="{{ doctor.specialty }}">
                </div>
                <div class="form-group">
                    <label class="form-label">License Number</label>
                    <input type="text" class="form-input" id="license" name="license" value="{{ doctor.license_number }}">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Hospital</label>
                    <input type="text" class="form-input" id="hospital" name="hospital" value="{{ doctor.hospital }}">
                </div>
                <div class="form-group">
                    <label class="form-label">Experience (years)</label>
                    <input type="number" class="form-input" id="experience" name="experience" value="{{ doctor.experience }}">
                </div>
            </div>

            <div class="action-buttons">
                <button type="submit" class="btn-save">💾 Save Changes</button>
                <button type="button" class="btn-cancel" onclick="goBack()">↩️ Cancel</button>
            </div>
        </form>
    </div>

    <script>
        function goBack() {
            window.location.href = '{% url "doctor_profile" %}';
        }
    </script>
</body>
</html>
