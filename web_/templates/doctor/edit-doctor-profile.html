{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Doctor Profile - Rehabilitation System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .edit-container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .edit-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
        }

        .back-btn {
            width: 50px;
            height: 50px;
            background: #f1f5f9;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn:hover {
            background: #e2e8f0;
            transform: translateX(-5px);
        }

        .edit-header h2 {
            color: #1e293b;
            font-size: 32px;
            font-weight: 700;
        }

        /* Avatar Section */
        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
        }

        .avatar-large {
            width: 120px;
            height: 120px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: #60a5fa;
            border: 4px solid #60a5fa;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .avatar-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-buttons {
            display: flex;
            gap: 15px;
        }

        .btn-upload, .btn-delete-avatar {
            padding: 8px 20px;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-upload {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-delete-avatar {
            background: #f1f5f9;
            color: #dc2626;
        }

        .btn-delete-avatar:hover {
            background: #fee2e2;
            transform: translateY(-2px);
        }

        /* Info Grid - Same as Edit Patient Profile */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-card {
            background: #f8fafc;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #e2e8f0;
            transition: all 0.3s;
        }

        .info-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .info-card h3 {
            color: #1e293b;
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-card h3 i {
            color: #667eea;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            background: white;
        }

        .form-input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-input:disabled {
            background: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .full-width {
            grid-column: span 2;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f1f5f9;
        }

        .btn-save, .btn-cancel {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-save {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .btn-cancel {
            background: #f1f5f9;
            color: #475569;
        }

        .btn-save:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-cancel:hover {
            background: #e2e8f0;
            transform: translateY(-3px);
        }

        /* Modal Styles */
        .avatar-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            backdrop-filter: blur(5px);
        }

        .avatar-modal-content {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .avatar-modal-content h3 {
            color: #1e293b;
            margin-bottom: 10px;
        }

        .avatar-modal-content p {
            color: #64748b;
            margin-bottom: 20px;
        }

        .avatar-preview {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.1);
            border: 4px solid #60a5fa;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: #60a5fa;
            overflow: hidden;
        }

        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-modal-save, .btn-modal-cancel {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-modal-save {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .btn-modal-cancel {
            background: #f1f5f9;
            color: #475569;
        }

        .btn-modal-save:hover, .btn-modal-cancel:hover {
            transform: translateY(-2px);
        }

        /* Notification */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(100%);
            }
        }

        .custom-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            z-index: 9999;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: slideIn 0.3s ease;
            max-width: 350px;
            text-align: center;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .edit-container {
                padding: 25px;
            }
            .info-grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
            .edit-header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="edit-container">
        <div class="edit-header">
            <button class="back-btn" onclick="goBack()">←</button>
            <h2><i class="fas fa-user-circle"></i> Edit Doctor Profile</h2>
        </div>

        <!-- Avatar Section -->
        <div class="avatar-section">
            <div class="avatar-large" id="avatarLarge">
                <i class="fas fa-user-circle"></i>
            </div>
            <div class="avatar-buttons">
                <button class="btn-upload" onclick="showAvatarUploadModal()">
                    <i class="fas fa-camera"></i> Upload Avatar
                </button>
                <button class="btn-delete-avatar" onclick="deleteAvatar()">
                    <i class="fas fa-trash-alt"></i> Delete Avatar
                </button>
            </div>
        </div>

        <div class="info-grid">
            <!-- Personal Information Card -->
            <div class="info-card">
                <h3><i class="fas fa-id-card"></i> Personal Information</h3>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-user"></i> Full Name</label>
                    <input type="text" class="form-input" id="fullName">
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-id-card"></i> Doctor ID</label>
                    <input type="text" class="form-input" id="doctorId" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" class="form-input" id="email">
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-phone"></i> Phone</label>
                    <input type="tel" class="form-input" id="phone">
                </div>
            </div>

            <!-- Professional Information Card -->
            <div class="info-card">
                <h3><i class="fas fa-stethoscope"></i> Professional Information</h3>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-stethoscope"></i> Specialty</label>
                    <input type="text" class="form-input" id="specialty">
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-certificate"></i> License Number</label>
                    <input type="text" class="form-input" id="license" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-hospital"></i> Hospital</label>
                    <input type="text" class="form-input" id="hospital">
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-briefcase"></i> Experience (years)</label>
                    <input type="number" class="form-input" id="experience">
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button type="button" class="btn-save" onclick="saveDoctorProfile()">
                <i class="fas fa-save"></i> Save Changes
            </button>
            <button type="button" class="btn-cancel" onclick="goBack()">
                <i class="fas fa-times"></i> Cancel
            </button>
        </div>
    </div>

    <script>
        // ============================================
        // GLOBAL VARIABLES
        // ============================================
        let doctorName = localStorage.getItem('doctorName') || 'Dr. Ahmad';
        let doctorId = localStorage.getItem('doctorId') || '3';
        let doctorSpecialty = localStorage.getItem('doctorSpecialty') || 'Physiotherapy';

        // ============================================
        // INITIALIZATION
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            loadDoctorData();
            loadAvatar();
        });

        // ============================================
        // LOAD DOCTOR DATA
        // ============================================
        function loadDoctorData() {
            document.getElementById('fullName').value = localStorage.getItem('doctorName') || 'Dr. Ahmad';
            document.getElementById('doctorId').value = localStorage.getItem('doctorId') || '3';
            document.getElementById('email').value = localStorage.getItem('doctorEmail') || 'dr.ahmad@clinic.com';
            document.getElementById('phone').value = localStorage.getItem('doctorPhone') || '0500000000';
            document.getElementById('specialty').value = localStorage.getItem('doctorSpecialty') || 'Physiotherapy';
            document.getElementById('license').value = localStorage.getItem('doctorLicense') || 'LIC12345';
            document.getElementById('hospital').value = localStorage.getItem('doctorHospital') || 'Central Hospital';
            document.getElementById('experience').value = localStorage.getItem('doctorExperience') || '10';
        }

        // ============================================
        // SAVE DOCTOR PROFILE
        // ============================================
        function saveDoctorProfile() {
            const updatedData = {
                name: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                specialty: document.getElementById('specialty').value,
                license: document.getElementById('license').value,
                hospital: document.getElementById('hospital').value,
                experience: document.getElementById('experience').value
            };

            if (!updatedData.name || !updatedData.email || !updatedData.phone) {
                showNotification('Please fill in all required fields', 'error');
                return;
            }

            localStorage.setItem('doctorName', updatedData.name);
            localStorage.setItem('doctorEmail', updatedData.email);
            localStorage.setItem('doctorPhone', updatedData.phone);
            localStorage.setItem('doctorSpecialty', updatedData.specialty);
            localStorage.setItem('doctorHospital', updatedData.hospital);
            localStorage.setItem('doctorExperience', updatedData.experience);

            showNotification('Profile updated successfully!', 'success');

            setTimeout(() => {
                window.location.href = "{% url 'profile' %}";
            }, 1500);
        }

        // ============================================
        // AVATAR FUNCTIONS
        // ============================================
        function loadAvatar() {
            const savedAvatar = localStorage.getItem('doctorAvatar');
            const avatarLarge = document.getElementById('avatarLarge');

            if (savedAvatar && savedAvatar !== 'null' && savedAvatar !== '') {
                avatarLarge.innerHTML = `<img src="${savedAvatar}" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">`;
            } else {
                avatarLarge.innerHTML = `<i class="fas fa-user-circle"></i>`;
            }
        }

        function saveAvatarToLocalStorage(imageData) {
            localStorage.setItem('doctorAvatar', imageData);
            sessionStorage.setItem('doctorAvatar', imageData);
        }

        function deleteAvatar() {
            localStorage.removeItem('doctorAvatar');
            sessionStorage.removeItem('doctorAvatar');
            
            const avatarLarge = document.getElementById('avatarLarge');
            avatarLarge.innerHTML = `<i class="fas fa-user-circle"></i>`;
            
            showNotification('Avatar deleted successfully!', 'success');
        }

        function showAvatarUploadModal() {
            const modal = document.createElement('div');
            modal.className = 'avatar-modal';
            
            modal.innerHTML = `
                <div class="avatar-modal-content">
                    <h3><i class="fas fa-camera"></i> Upload Avatar</h3>
                    <p>Choose a profile picture for your account</p>
                    <div class="avatar-preview" id="avatarPreview">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <input type="file" id="avatarUpload" accept="image/*" style="margin: 20px 0; width: 100%;">
                    <div class="avatar-modal-buttons">
                        <button id="saveAvatarBtn" class="btn-modal-save">
                            <i class="fas fa-save"></i> Save
                        </button>
                        <button id="cancelAvatarBtn" class="btn-modal-cancel">
                            <i class="fas fa-times"></i> Cancel
                        </button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            const fileInput = modal.querySelector('#avatarUpload');
            const previewDiv = modal.querySelector('#avatarPreview');
            
            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        previewDiv.innerHTML = `<img src="${event.target.result}" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">`;
                    };
                    reader.readAsDataURL(file);
                }
            });
            
            modal.querySelector('#saveAvatarBtn').onclick = function() {
                const file = fileInput.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const imageData = event.target.result;
                        saveAvatarToLocalStorage(imageData);
                        loadAvatar();
                        showNotification('Avatar updated successfully!', 'success');
                    };
                    reader.readAsDataURL(file);
                } else {
                    showNotification('Please select an image first', 'error');
                }
                modal.remove();
            };
            
            modal.querySelector('#cancelAvatarBtn').onclick = function() {
                modal.remove();
            };
            
            modal.onclick = function(e) {
                if (e.target === modal) modal.remove();
            };
        }

        // ============================================
        // NOTIFICATION SYSTEM
        // ============================================
        function showNotification(message, type = 'info') {
            const oldNotification = document.querySelector('.custom-notification');
            if (oldNotification) oldNotification.remove();
            
            const notification = document.createElement('div');
            notification.className = 'custom-notification';
            
            const icon = type === 'success' ? 'fa-check-circle' : 
                         type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            
            notification.innerHTML = `<i class="fas ${icon}"></i> ${message}`;
            
            const colors = {
                info: 'linear-gradient(135deg, #3b82f6, #1d4ed8)',
                success: 'linear-gradient(135deg, #10b981, #059669)',
                error: 'linear-gradient(135deg, #ef4444, #dc2626)'
            };
            
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 25px;
                border-radius: 12px;
                background: ${colors[type] || colors.info};
                color: white;
                font-weight: 500;
                z-index: 9999;
                box-shadow: 0 10px 25px rgba(0,0,0,0.2);
                animation: slideIn 0.3s ease;
                max-width: 350px;
                text-align: center;
                display: flex;
                align-items: center;
                gap: 12px;
                font-size: 15px;
                cursor: pointer;
            `;
            
            notification.onclick = () => {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            };
            
            document.body.appendChild(notification);
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.style.animation = 'slideOut 0.3s ease';
                    setTimeout(() => notification.remove(), 300);
                }
            }, 4000);
        }

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        function goBack() {
            window.location.href = "{% url 'profile' %}";
        }

        // Listen for storage changes
        window.addEventListener('storage', function(e) {
            if (e.key === 'doctorAvatar') {
                loadAvatar();
            }
        });
    </script>
</body>
</html>
