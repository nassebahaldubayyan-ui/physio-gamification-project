<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Matching Game - Rehab</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        #unity-container { width: 100vw; height: 100vh; }
        canvas { width: 100%; height: 100%; display: block; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>
    <div id="unity-container"></div>

    <script>
        window.submitMatchingScore = function(score, matches, userId) {
            console.log(`Matching Game - Score: ${score}, Matches: ${matches}, User: ${userId}`);
            
            fetch('/api/save-game-result/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ 
                    game: 'matching',
                    score: score, 
                    matches: matches,
                    user_id: userId 
                })
            })
            .then(response => response.json())
            .then(data => console.log('Saved:', data))
            .catch(error => console.error('Error:', error));
        };

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // تحميل Unity WebGL
        var buildUrl = "/static/matching_build/Build";
        var loaderUrl = buildUrl + "/matching_build.loader.js";
        var config = {
            dataUrl: buildUrl + "/matching_build.data",
            frameworkUrl: buildUrl + "/matching_build.framework.js",
            codeUrl: buildUrl + "/matching_build.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "RehabGames",
            productName: "MatchingGame",
            productVersion: "1.0"
        };
        
        var container = document.querySelector("#unity-container");
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(container, config, (progress) => {})
                .then((unityInstance) => {
                    window.unityInstance = unityInstance;
                    var userId = {{ request.user.id|default:1 }};
                    unityInstance.sendMessage('GameManager', 'SetUserID', userId);
                })
                .catch((message) => { console.error(message); });
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
