<!-- templates/game_page.html -->
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>لعبة جمع النجوم</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        #unity-container { width: 100vw; height: 100vh; }
        canvas { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>
    <div id="unity-container"></div>

    <script>
        // هذه الدالة ستناديها Unity لحفظ النتيجة
        window.submitScoreToServer = function(score, userId) {
            console.log(`Unity is sending score: ${score} for user: ${userId}`);
            
            // استخدام Fetch API لإرسال البيانات إلى Django
            fetch('/api/update-score/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken') // مهم لـ Django
                },
                body: JSON.stringify({ 'score': score, 'user_id': userId })
            })
            .then(response => response.json())
            .then(data => console.log('Success:', data))
            .catch((error) => console.error('Error:', error));
        };

        // دالة مساعدة لجلب الـ CSRF Token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // تحميل اللعبة (Unity WebGL Loader)
        var buildUrl = "{% static 'game_build/Build' %}"; // استخدم tag الخاصة بـ Django
        var loaderUrl = buildUrl + "/Build.loader.js";
        var config = {
            dataUrl: buildUrl + "/Build.data",
            frameworkUrl: buildUrl + "/Build.framework.js",
            codeUrl: buildUrl + "/Build.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "YourCompany",
            productName: "StarGame",
            productVersion: "1.0"
        };
        var container = document.querySelector("#unity-container");
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(container, config, (progress) => {})
                .then((unityInstance) => {
                    window.unityInstance = unityInstance; // حفظ الـ instance للاستخدام
                    // بعد تحميل اللعبة، أرسل user_id الحالي من Django إلى Unity
                    var userId = {{ request.user.id|default:1 }};
                    unityInstance.SendMessage('GameManager', 'SetUserID', userId);
                })
                .catch((message) => { console.error(message); });
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
