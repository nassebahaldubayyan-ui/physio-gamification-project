<!-- templates/myapp/game.html -->
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Catching Stars Game</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #game-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a2a; }
        #unity-canvas { width: 100%; height: 100%; display: block; }
        /* شاشة تحميل بسيطة */
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a2e; display: flex; justify-content: center; align-items: center;
            z-index: 1000; color: white; font-size: 24px; flex-direction: column;
        }
        .spinner { border: 4px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 4px solid #fff;
                   width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="unity-canvas" width="1280" height="720"></canvas>
    </div>
    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <div>Loading Game... 🎮</div>
    </div>

    <script>
        // --- 1. ربط Django API (حفظ النتيجة) ---
        // هذه الدالة تُنادى من داخل لعبة Unity
        window.submitScoreToServer = function(score, userId) {
            console.log(`Unity is sending score: ${score} for user: ${userId}`);
            fetch('/api/update-score/', {  // المسار الذي سننشئه في Django
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                body: JSON.stringify({ 'score': score, 'user_id': userId })
            })
            .then(response => response.json())
            .then(data => console.log('Score saved:', data))
            .catch(error => console.error('Error saving score:', error));
        };
        
        // --- 2. ربط الذكاء الاصطناعي (HTTP API) ---
        // هذه الدالة ترسل إحداثيات اليد إلى برنامج Python الخارجي
        function sendHandDataToAI(palmX, palmY, handClosed) {
            fetch('http://127.0.0.1:5000/hand-data', { // Python server port 5000
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ palm_x: palmX, palm_y: palmY, hand_closed: handClosed })
            }).catch(error => console.log('AI Tracker not running?', error));
        }

        // دالة مساعدة لجلب CSRF Token (خاص بـ Django)
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // --- 3. تحميل لعبة Unity ---
        var unityInstance = null;
        var buildUrl = "{% static 'game_build' %}";  // Django tag
        var loaderUrl = buildUrl + "/Build.loader.js";
        var config = {
            dataUrl: buildUrl + "/Build.data",
            frameworkUrl: buildUrl + "/Build.framework.js",
            codeUrl: buildUrl + "/Build.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "YourCompany",
            productName: "StarGame",
            productVersion: "1.0"
        };

        var container = document.querySelector("#game-container");
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(container, config, (progress) => {})
                .then((instance) => {
                    unityInstance = instance;
                    document.getElementById('loading-overlay').style.display = 'none';
                    // إرسال user_id من Django إلى Unity
                    var userId = {{ request.user.id|default:1 }};
                    unityInstance.SendMessage('GameManager', 'SetUserID', userId);
                })
                .catch((message) => { console.error(message); document.getElementById('loading-overlay').innerHTML = 'Failed to load game.'; });
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
