<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Rehabilitation System{% endblock %}</title>
    
    {% load static %}
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <!-- تعطيل أي ألوان زرقاء -->
    <style>
        /* تعطيل مؤقت */
        .avatar i,
        .doctor-info .avatar i {
            font-size: 60px;
            /* color: #60a5fa; */  /* تم التعطيل */
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .avatar {
            /* border-color: #60a5fa; */  /* تم التعطيل */
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <!-- JavaScript -->
    <script src="{% static 'js/script.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
