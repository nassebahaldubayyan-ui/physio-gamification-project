{% extends "base.html" %}
{% load static %}

{% block title %}Doctor Login - Rehabilitation System{% endblock %}

{% block content %}
<div class="login-container">
    <div class="avatar">
        <i class="fas fa-user-md"></i>
    </div>
    
    <h2>Doctor Login</h2>
    <p>Enter your credentials to access the dashboard</p>
    
    <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" value="dr.ahmad@clinic.com">
    </div>
    
    <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" value="password123">
    </div>
    
    <div class="error-message" id="errorMessage"></div>
    <div class="loading" id="loading">Logging in...</div>
    
    <button class="login-btn" onclick="loginDoctor()">Login to Dashboard</button>
    
    <button class="back-btn" onclick="window.location.href='{% url "index" %}'">
        <span>←</span> Back to Main Menu
    </button>
</div>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
        background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    
    .login-container {
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        width: 400px;
        text-align: center;
        margin: 0 auto;
    }
    
    .avatar {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        border-radius: 50%;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 40px;
        box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
    }
    
    .login-container h2 {
        color: #1e293b;
        font-size: 28px;
        margin-bottom: 10px;
    }
    
    .login-container p {
        color: #64748b;
        margin-bottom: 30px;
    }
    
    .input-group {
        margin-bottom: 20px;
        text-align: left;
    }
    
    .input-group label {
        display: block;
        color: #1e293b;
        font-weight: 600;
        margin-bottom: 5px;
    }
    
    .input-group input {
        width: 100%;
        padding: 12px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 16px;
        transition: border 0.3s;
    }
    
    .input-group input:focus {
        border-color: #3b82f6;
        outline: none;
    }
    
    .login-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.3s, box-shadow 0.3s;
        margin-top: 10px;
    }
    
    .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
    }
    
    .back-btn {
        margin-top: 20px;
        padding: 12px 20px;
        background: #f1f5f9;
        color: #475569;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }
    
    .back-btn:hover {
        background: #e2e8f0;
        transform: translateY(-2px);
    }
    
    .error-message {
        color: #ef4444;
        margin-top: 10px;
        display: none;
    }
    
    .loading {
        color: #3b82f6;
        margin-top: 10px;
        display: none;
    }
</style>

<script>
    function loginDoctor() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        
        if (!email || !password) {
            showError('Please enter both email and password');
            return;
        }

        document.getElementById('loading').style.display = 'block';
        document.getElementById('errorMessage').style.display = 'none';
        
        // Multiple Doctors Database
        setTimeout(() => {
            const validDoctors = {
                'dr.ahmad@clinic.com': {
                    name: 'Dr. Ahmad',
                    id: 'DR001',
                    specialty: 'Physiotherapy'
                },
                'dr.sarah@clinic.com': {
                    name: 'Dr. Sarah',
                    id: 'DR002',
                    specialty: 'Occupational Therapy'
                },
                'dr.khaled@clinic.com': {
                    name: 'Dr. Khaled',
                    id: 'DR003',
                    specialty: 'Physical Medicine'
                },
                'dr.fatima@clinic.com': {
                    name: 'Dr. Fatima',
                    id: 'DR004',
                    specialty: 'Pediatric Therapy'
                },
                'dr.omar@clinic.com': {
                    name: 'Dr. Omar',
                    id: 'DR005',
                    specialty: 'Sports Rehabilitation'
                }
            };
            
            // Check if doctor exists
            if (validDoctors[email]) {
                const doctor = validDoctors[email];
                
                // Store doctor data
                localStorage.setItem('userType', 'doctor');
                localStorage.setItem('doctorId', doctor.id);
                localStorage.setItem('doctorName', doctor.name);
                localStorage.setItem('doctorEmail', email);
                localStorage.setItem('doctorSpecialty', doctor.specialty);
                localStorage.setItem('doctorPhone', '0500000000');
                
                window.location.href = '{% url "doctor" %}';
            } else {
                showError('Invalid email or password');
                document.getElementById('loading').style.display = 'none';
            }
        }, 1000);
    }

    function showError(message) {
        const errorEl = document.getElementById('errorMessage');
        errorEl.textContent = message;
        errorEl.style.display = 'block';
        document.getElementById('loading').style.display = 'none';
    }

    // Allow Enter key to submit
    document.getElementById('password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            loginDoctor();
        }
    });
</script>
{% endblock %}
