{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login - Rehabilitation System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-page {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            position: relative;
            overflow: hidden;
        }

        .login-page::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.1"><circle cx="50" cy="50" r="40" stroke="white" stroke-width="2" fill="none"/><circle cx="50" cy="50" r="20" stroke="white" stroke-width="2" fill="none"/></svg>');
            background-repeat: repeat;
            animation: rotate 60s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 450px;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .login-icon {
            font-size: 60px;
            color: #3b82f6;
            margin-bottom: 20px;
        }

        .login-title {
            font-size: 32px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .login-subtitle {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-label {
            display: block;
            color: #1e293b;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-field {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .input-field:focus {
            border-color: #3b82f6;
            outline: none;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-btn:hover {
            transform: translateY(-3px);
        }

        .back-btn {
            margin-top: 20px;
            padding: 12px 20px;
            background: #f1f5f9;
            color: #475569;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }

        .error-message {
            color: #ef4444;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .loading {
            color: #3b82f6;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        @media (max-width: 768px) {
            .login-container {
                width: 90%;
                padding: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-icon">
                <i class="fas fa-user-md"></i>
            </div>
            <h2 class="login-title">Doctor Login</h2>
            <p class="login-subtitle">Enter your credentials to access the dashboard</p>

            <div class="input-group">
                <label class="input-label">Email</label>
                <input type="email" class="input-field" id="doctorEmail" placeholder="Enter your email">
            </div>

            <div class="input-group">
                <label class="input-label">Password</label>
                <input type="password" class="input-field" id="doctorPassword" placeholder="Enter your password">
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="loading" id="loading">Logging in...</div>

            <button class="login-btn" onclick="loginDoctor()">
                <i class="fas fa-sign-in-alt"></i> Login to Dashboard
            </button>

            <button class="back-btn" onclick="window.location.href='{% url 'index' %}'">
                <i class="fas fa-arrow-left"></i> Back to Main Menu
            </button>
        </div>
    </div>

    <script src="{% static 'js/script.js' %}"></script>
    <script>
        document.getElementById('doctorPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loginDoctor();
            }
        });
    </script>
</body>
</html>
