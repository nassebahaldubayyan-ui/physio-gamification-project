{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login - Rehabilitation System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            width: 400px;
            text-align: center;
        }
        
        .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
        }
        
        .login-container h2 {
            color: #1e293b;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .login-container p {
            color: #64748b;
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .input-group label {
            display: block;
            color: #1e293b;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s;
        }
        
        .input-group input:focus {
            border-color: #3b82f6;
            outline: none;
        }
        
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-top: 10px;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }
        
        .back-btn {
            margin-top: 20px;
            padding: 12px 20px;
            background: #f1f5f9;
            color: #475569;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-btn:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }
        
        .error-message {
            color: #ef4444;
            margin-top: 10px;
            display: none;
        }
        
        .loading {
            color: #3b82f6;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Hidden CSRF Token for Django -->
        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}" id="csrfToken">
        
        <div class="avatar">
            <i class="fas fa-user-md"></i>
        </div>
        
        <h2>Doctor Login</h2>
        <p>Enter your credentials to access the dashboard</p>
        
        <div class="input-group">
            <label>Username or Email</label>
            <input type="text" id="username" placeholder="Enter your username or email">
        </div>
        
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>
        
        <div class="error-message" id="errorMessage">Invalid username or password for doctor account</div>
        <div class="loading" id="loading">Logging in...</div>
        
        <button class="login-btn" onclick="loginDoctor()">Login to Dashboard</button>
        
        <button class="back-btn" onclick="goBack()">
            <span>←</span> Back to Main Menu
        </button>
    </div>

    <script src="{% static 'js/script.js' %}"></script>
    <script>
        async function loginDoctor() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!username || !password) {
                showError('Please enter both username/email and password');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';

            try {
                const response = await fetch("{% url 'api_login' %}", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.getElementById('csrfToken').value
                    },
                    body: JSON.stringify({ 
                        username: username,
                        password: password 
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Check if user is a doctor
                    if (data.user_type === 'doctor') {
                        // Store user data in localStorage
                        localStorage.setItem('isAuthenticated', 'true');
                        localStorage.setItem('userType', data.user_type);
                        localStorage.setItem('username', data.username);
                        localStorage.setItem('firstName', data.first_name || '');
                        localStorage.setItem('lastName', data.last_name || '');
                        
                        // Redirect to doctor dashboard
                        window.location.href = "{% url 'doctor_dashboard' %}";
                    } else {
                        showError('This account is not registered as a doctor. Please use the correct login page.');
                    }
                } else {
                    showError(data.error || 'Invalid username or password');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Connection error. Please try again.');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            
            // Hide error after 5 seconds
            setTimeout(() => {
                errorEl.style.display = 'none';
            }, 5000);
        }

        function goBack() {
            window.location.href = "{% url 'index' %}";
        }

        // Add enter key support
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loginDoctor();
            }
        });

        // Pre-fill if coming from another page (optional)
        document.addEventListener('DOMContentLoaded', function() {
            // Check if already logged in as doctor
            if (localStorage.getItem('isAuthenticated') === 'true' && 
                localStorage.getItem('userType') === 'doctor') {
                window.location.href = "{% url 'doctor_dashboard' %}";
            }
        });
    </script>
</body>
</html>
