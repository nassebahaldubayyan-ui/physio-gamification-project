{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contact Us - PhysioPlay</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    overflow: hidden;
}

:root {
    --header-height: 52px;
}

body {
    margin: 0;
    background: #ffffff;
    overflow: hidden;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    color: #111827;
    position: relative;
    height: 100vh;
}

/* Header */
.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: var(--header-height);
    padding: 6px 18px;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(17, 24, 39, 0.08);
}

/* Logo styling - matching index, gamer, doctor pages */
.brand {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.02em;
    text-decoration: none;
}

.brand .physio {
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.brand .play {
    background: linear-gradient(135deg, #10b981, #059669);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.header-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.header-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 999px;
    border: 1px solid rgba(17, 24, 39, 0.14);
    background: rgba(255, 255, 255, 0.65);
    color: inherit;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    line-height: 1;
}

.header-btn:hover {
    border-color: rgba(17, 24, 39, 0.28);
}

/* Background Shapes */
.bg-shapes {
    position: fixed;
    top: var(--header-height);
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
}

.shape-1 {
    position: absolute;
    top: 5%;
    left: 2%;
    width: 280px;
    height: 200px;
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.35), rgba(118, 75, 162, 0.25));
    border-radius: 35px;
    transform: rotate(8deg);
    opacity: 0.6;
    filter: blur(8px);
}

.shape-2 {
    position: absolute;
    top: 8%;
    right: 3%;
    width: 220px;
    height: 220px;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.35), rgba(29, 78, 216, 0.25));
    border-radius: 50%;
    opacity: 0.6;
    filter: blur(8px);
}

.shape-3 {
    position: absolute;
    top: 35%;
    left: 0%;
    width: 260px;
    height: 180px;
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.35), rgba(5, 150, 105, 0.25));
    border-radius: 50% 50% 45% 55% / 55% 45% 55% 45%;
    opacity: 0.55;
    filter: blur(8px);
}

.shape-4 {
    position: absolute;
    top: 40%;
    right: 1%;
    width: 240px;
    height: 180px;
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.35), rgba(109, 40, 217, 0.25));
    border-radius: 40px;
    transform: rotate(-5deg);
    opacity: 0.55;
    filter: blur(8px);
}

/* Content */
.content {
    position: relative;
    z-index: 10;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}

.contact-card {
    max-width: 700px;
    width: 90%;
    background: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(12px);
    border-radius: 40px;
    padding: 50px;
    pointer-events: auto;
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    text-align: center;
    max-height: 85vh;
    overflow-y: auto;
}

.contact-icon {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 25px;
}

.contact-icon i {
    font-size: 40px;
    color: white;
}

h1 {
    font-size: 36px;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    color: #64748b;
    margin-bottom: 30px;
    font-size: 16px;
}

.contact-methods {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-bottom: 40px;
    flex-wrap: wrap;
}

.method {
    text-align: center;
}

.method i {
    font-size: 32px;
    color: #667eea;
    margin-bottom: 10px;
}

.method h3 {
    font-size: 18px;
    margin-bottom: 5px;
    color: #1e293b;
}

.method p, .method a {
    color: #64748b;
    text-decoration: none;
    font-size: 14px;
}

.method a:hover {
    color: #667eea;
}

.contact-form {
    margin-top: 30px;
    text-align: left;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #1e293b;
    font-size: 14px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    font-family: inherit;
    font-size: 15px;
    transition: all 0.2s;
    background: white;
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.form-group textarea {
    resize: vertical;
    min-height: 100px;
}

.submit-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
}

.submit-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

.message-status {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    display: none;
    text-align: center;
    font-size: 14px;
}

.message-status.success {
    background: #dcfce7;
    color: #166534;
    display: block;
}

.message-status.error {
    background: #fee2e2;
    color: #991b1b;
    display: block;
}

/* Scrollbar */
.contact-card::-webkit-scrollbar {
    width: 6px;
}

.contact-card::-webkit-scrollbar-track {
    background: rgba(0,0,0,0.05);
    border-radius: 10px;
}

.contact-card::-webkit-scrollbar-thumb {
    background: #667eea;
    border-radius: 10px;
}

@media (max-width: 700px) {
    .contact-card { padding: 30px; }
    h1 { font-size: 28px; }
    .contact-methods { gap: 20px; }
}
</style>
</head>
<body>

<header class="header">
    <a class="brand" href="{% url 'index' %}">
        <span class="physio">Physio</span><span class="play">Play</span>
    </a>
    <nav class="header-nav">
        <a class="header-btn" href="{% url 'index' %}">Home</a>
        <a class="header-btn" href="{% url 'about_us' %}">About Us</a>
    </nav>
</header>

<div class="bg-shapes">
    <div class="shape-1"></div>
    <div class="shape-2"></div>
    <div class="shape-3"></div>
    <div class="shape-4"></div>
</div>

<main class="content">
    <div class="contact-card">
        <div class="contact-icon">
            <i class="fas fa-envelope"></i>
        </div>
        <h1>Contact Us</h1>
        <p class="subtitle">We'd love to hear from you!</p>

        <div class="contact-methods">
            <div class="method">
                <i class="fas fa-envelope"></i>
                <h3>Email</h3>
                <p>physioplay.support@gmail.com</p>
            </div>
        </div>

        <form id="contactForm" class="contact-form">
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Subject</label>
                <input type="text" id="subject" placeholder="What is this about?">
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea id="message" placeholder="Write your message here..." required></textarea>
            </div>
            <button type="submit" class="submit-btn">
                <i class="fas fa-paper-plane"></i> Send Message
            </button>
            <div id="messageStatus" class="message-status"></div>
        </form>
    </div>
</main>

<script>
    document.getElementById('contactForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const subject = document.getElementById('subject').value.trim();
        const message = document.getElementById('message').value.trim();
        const statusDiv = document.getElementById('messageStatus');
        const submitBtn = document.querySelector('.submit-btn');
        
        if (!name || !email || !message) {
            statusDiv.className = 'message-status error';
            statusDiv.innerHTML = '❌ Please fill in all required fields.';
            return;
        }
        
        submitBtn.disabled = true;
        submitBtn.innerHTML = '⏳ Sending...';
        
        try {
            const response = await fetch('/api/send-contact/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, subject, message })
            });
            
            const data = await response.json();
            
            if (data.success) {
                statusDiv.className = 'message-status success';
                statusDiv.innerHTML = '✅ Message sent successfully! We\'ll get back to you soon.';
                document.getElementById('contactForm').reset();
            } else {
                statusDiv.className = 'message-status error';
                statusDiv.innerHTML = '❌ ' + (data.error || 'Error sending message');
            }
        } catch (error) {
            statusDiv.className = 'message-status error';
            statusDiv.innerHTML = '❌ Connection error. Please try again.';
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Message';
            setTimeout(() => {
                statusDiv.style.display = 'none';
                statusDiv.className = 'message-status';
            }, 5000);
        }
    });
</script>

</body>
</html>
