{% load static %}
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contact Us - rehabbo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
:root {
    --header-height: 52px;
}

html, body {
    min-height: 100%;
}

body {
    margin: 0;
    background: #ffffff;
    color: #111827;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
}

.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    min-height: var(--header-height);
    padding: 6px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(17, 24, 39, 0.08);
}

.brand {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.02em;
    text-transform: lowercase;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-decoration: none;
}

.header-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.header-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 999px;
    border: 1px solid rgba(17, 24, 39, 0.14);
    background: rgba(255, 255, 255, 0.65);
    color: inherit;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
}

.header-btn:hover {
    border-color: rgba(17, 24, 39, 0.28);
}

.back-home {
    background: rgba(102, 126, 234, 0.1);
    border-color: #667eea;
    color: #667eea;
}

.bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
}

.shape {
    position: absolute;
    box-shadow: 0 18px 45px rgba(17, 24, 39, 0.06);
    opacity: 0.85;
}

.s1 { width: 240px; height: 170px; left: 3%; top: 88px; background: linear-gradient(135deg, rgba(102, 126, 234, 0.62), rgba(118, 75, 162, 0.42)); border-radius: 48% 52% 44% 56% / 56% 44% 56% 44%; }
.s2 { width: 170px; height: 210px; right: -35px; top: 96px; background: linear-gradient(135deg, rgba(59, 130, 246, 0.55), rgba(29, 78, 216, 0.35)); border-radius: 55px; }
.s3 { width: 200px; height: 175px; left: -30px; bottom: 12%; background: linear-gradient(135deg, rgba(16, 185, 129, 0.50), rgba(5, 150, 105, 0.30)); border-radius: 45px; }
.s4 { width: 220px; height: 180px; right: 5%; bottom: 14%; background: linear-gradient(135deg, rgba(139, 92, 246, 0.52), rgba(109, 40, 217, 0.32)); border-radius: 70px; }

.content {
    min-height: 100vh;
    padding: calc(var(--header-height) + 60px) 18px 60px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.contact-card {
    max-width: 700px;
    width: 100%;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(17, 24, 39, 0.08);
    border-radius: 32px;
    box-shadow: 0 24px 60px rgba(17, 24, 39, 0.10);
    padding: 48px 40px;
    text-align: center;
}

.contact-icon {
    width: 90px;
    height: 90px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 30px;
}

.contact-icon i {
    font-size: 45px;
    color: white;
}

h1 {
    font-size: clamp(36px, 5vw, 48px);
    margin: 0 0 10px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    color: #718096;
    margin-bottom: 30px;
    font-size: 16px;
}

.contact-form {
    margin-top: 10px;
    text-align: left;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #2d3748;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    font-family: inherit;
    font-size: 16px;
    transition: border-color 0.2s;
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.form-group textarea {
    resize: vertical;
    min-height: 100px;
}

.submit-btn {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    padding: 14px 32px;
    border-radius: 40px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    justify-content: center;
}

.submit-btn:hover {
    transform: translateY(-2px);
}

.back-home-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 25px;
    padding: 12px 28px;
    background: #f1f5f9;
    color: #4a5568;
    text-decoration: none;
    border-radius: 40px;
    font-weight: 600;
    transition: all 0.2s;
}

.back-home-btn:hover {
    background: #e2e8f0;
    transform: translateY(-2px);
}

.message-status {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    display: none;
    text-align: center;
}

.message-status.success {
    background: #dcfce7;
    color: #166534;
    display: block;
}

.message-status.error {
    background: #fee2e2;
    color: #991b1b;
    display: block;
}

/* إخفاء قسم التواصل الجانبي */
.contact-info-side {
    display: none;
}
</style>
</head>
<body>


<div class="bg" aria-hidden="true">
    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>
    <div class="shape s4"></div>
</div>

<main class="content">
    <div class="contact-card">
        <div class="contact-icon">
            <i class="fas fa-envelope"></i>
        </div>
        <h1>Contact Us</h1>
        <p class="subtitle">Reach out to us for partnerships, onboarding clinics, or support. We'll get back to you as soon as possible.</p>
        
        <h3 style="margin: 20px 0 20px; color: #2d3748; font-size: 24px;">Send us a message</h3>
        
        <form id="contactForm" class="contact-form">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" placeholder="What is this about?">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" placeholder="Write your message here..." required></textarea>
            </div>
            <div>
                <button type="submit" class="submit-btn">
                    <i class="fas fa-paper-plane"></i> Send Message
                </button>
            </div>
            <div id="messageStatus" class="message-status"></div>
        </form>
        
        <a href="{% url 'index' %}" class="back-home-btn">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
    </div>
</main>

<script>
    document.getElementById('contactForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const subject = document.getElementById('subject').value;
        const message = document.getElementById('message').value;
        const statusDiv = document.getElementById('messageStatus');
        
        if (!name || !email || !message) {
            statusDiv.className = 'message-status error';
            statusDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> Please fill in all required fields.';
            return;
        }
        
        statusDiv.className = 'message-status success';
        statusDiv.innerHTML = '<i class="fas fa-check-circle"></i> Message sent successfully! We\'ll get back to you soon.';
        
        document.getElementById('contactForm').reset();
        
        setTimeout(() => {
            statusDiv.style.display = 'none';
            statusDiv.className = 'message-status';
        }, 5000);
    });
</script>
</body>
</html>
